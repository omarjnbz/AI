<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>August Renner - Photographer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>

<section class="hero-section">
  <nav class="navbar">
    <div class="brand">
      <h2 class="name">August Renner</h2>
      <p class="title">Photographer</p>
    </div>
    <div class="logo-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M14.31 8l5.74 9.94M9.69 8h11.48M7.38 12l5.74-9.94M9.69 16L3.95 6.06M14.31 16H2.83M16.62 12l-5.74 9.94"></path>
      </svg>
    </div>
    <button class="contact-btn">Contact</button>
  </nav>

  <div class="text-container">
    <div class="crop-mark top-left"></div>
    <div class="crop-mark top-right"></div>
    <div class="crop-mark bottom-left"></div>
    <div class="crop-mark bottom-right"></div>
    <h1 class="hero-text">AUGUST</h1>
  </div>

  <!-- Replace src with your transparent PNG cutout -->
  <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800&auto=format&fit=crop&q=80" alt="Model Cutout" class="hero-subject" />

  <div class="cta-container">
    <button class="cta-btn">Explore Work</button>
  </div>

  <div class="bottom-gradient"></div>
</section>

</body>
</html>
